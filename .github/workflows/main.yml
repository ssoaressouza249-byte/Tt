name: Build NEXGT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d extracted_project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate Project Root & Clean Template Extras
        id: locate
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Diretório do projeto encontrado em: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          find . -name "google-services.json" -delete || true
          find . -name "secrets.properties" -delete || true
          find . -name "debug.keystore" -delete || true

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload NEXGT APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXGT-FFBoost-Debug-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk

          
